$schema: https://json-schema.org/draft/2020-12/schema
$id: https://open-eda-labs.github.io/triage-contract/schemas/recommendation.yaml
title: Recommendation
description: 'Saída da triagem read-only e do vuln fixer (D-11). Validada por um passo sem modelo antes de qualquer publicação. Guardrail por arquitetura (D-13, R-01, R-02): nenhum campo extra em nenhum nível, texto curto em uma linha, sem URL, sem markdown de link ou imagem e sem `<` ou `>`. Links nunca vêm do modelo: o workflow os monta a partir das referências estruturadas (`event`, `collector`, `query_id`, `pr_number`).'
type: object
additionalProperties: false
required:
  - kind
  - status
  - trace_id
  - event
  - versions
  - hypotheses
  - not_enough_evidence
  - suggested_action
properties:
  kind:
    description: '`triage`: recomendação read-only a partir de alerta. `vuln_fix`: resultado do vuln fixer.'
    enum:
      - triage
      - vuln_fix
  status:
    description: Status final. `recommended` é a recomendação read-only publicada sem escrita em sistema; `pr_opened`, `no_change` e `failed` vêm do caminho de código.
    enum:
      - recommended
      - pr_opened
      - no_change
      - failed
  failure_reason:
    description: 'Obrigatório quando `status` = `failed`, proibido nos demais. Os valores aceitos dependem de `kind`: triagem não aceita `build_failed` nem `tests_failed`; vuln_fix não aceita `collector_error`.'
    enum:
      - collector_error
      - model_error
      - output_invalid
      - budget_exceeded
      - timeout
      - build_failed
      - tests_failed
      - publish_failed
  trace_id:
    description: trace-id W3C do `traceparent` do evento (D-12).
    type: string
    maxLength: 32
    pattern: ^(?!0{32})[0-9a-f]{32}$(?!\n)
  event:
    description: 'Referência ao evento de entrada: o par que define duplicata (D-10).'
    type: object
    additionalProperties: false
    required:
      - source
      - id
    properties:
      source:
        type: string
        maxLength: 80
        pattern: ^/(grafana|azure-monitor|datadog|osv-scanner|dependabot)/[a-z0-9][a-z0-9.-]{0,62}$(?!\n)
      id:
        type: string
        minLength: 1
        maxLength: 256
        pattern: ^(?!.*://)[A-Za-z0-9][A-Za-z0-9._:/=-]{0,255}$(?!\n)
  versions:
    type: object
    additionalProperties: false
    required:
      - schema
    properties:
      schema:
        description: Versão deste contrato que gerou o documento.
        type: string
        maxLength: 16
        pattern: ^0\.1\.(0|[1-9][0-9]{0,3})$(?!\n)
      prompt:
        description: 'Prompt versionado, ex.: triage.v1.'
        type: string
        minLength: 4
        maxLength: 64
        pattern: ^[a-z0-9][a-z0-9-]*\.v[0-9]{1,4}$(?!\n)
      model:
        description: Nome lógico do modelo no gateway ou na base_url (D-09), nunca o endpoint.
        type: string
        minLength: 1
        maxLength: 64
        pattern: ^[a-z0-9][a-z0-9._:-]{0,63}$(?!\n)
  hypotheses:
    description: Até 3 hipóteses, da mais provável para a menos provável (a ordem do array é a ordem). Vazio em `vuln_fix`, em `failed` e quando `not_enough_evidence` é true.
    type: array
    maxItems: 3
    items:
      $ref: '#/$defs/hypothesis'
  not_enough_evidence:
    description: true quando a evidência coletada não sustenta nenhuma hipótese. Sempre false em `vuln_fix`.
    type: boolean
  suggested_action:
    type: object
    additionalProperties: false
    required:
      - type
      - text
    properties:
      type:
        enum:
          - investigate
          - escalate
          - rollback_change
          - scale_resource
          - restart_component
          - review_pr
          - no_action
      text:
        $ref: '#/$defs/safeText'
        maxLength: 200
  fix:
    $ref: '#/$defs/fix'
allOf:
  - if:
      required:
        - kind
      properties:
        kind:
          const: triage
    then:
      required:
        - versions
      properties:
        status:
          enum:
            - recommended
            - failed
        failure_reason:
          enum:
            - collector_error
            - model_error
            - output_invalid
            - budget_exceeded
            - timeout
            - publish_failed
        versions:
          required:
            - prompt
            - model
      not:
        required:
          - fix
  - if:
      required:
        - kind
      properties:
        kind:
          const: vuln_fix
    then:
      required:
        - fix
      properties:
        status:
          enum:
            - pr_opened
            - no_change
            - failed
        failure_reason:
          enum:
            - model_error
            - output_invalid
            - budget_exceeded
            - timeout
            - build_failed
            - tests_failed
            - publish_failed
        hypotheses:
          maxItems: 0
        not_enough_evidence:
          const: false
  - if:
      required:
        - kind
        - fix
      properties:
        kind:
          const: vuln_fix
        fix:
          required:
            - level
          properties:
            level:
              const: N2
    then:
      properties:
        versions:
          required:
            - prompt
            - model
  - if:
      required:
        - not_enough_evidence
      properties:
        not_enough_evidence:
          const: true
    then:
      properties:
        hypotheses:
          maxItems: 0
        suggested_action:
          properties:
            type:
              enum:
                - investigate
                - escalate
  - if:
      required:
        - kind
        - status
        - not_enough_evidence
      properties:
        kind:
          const: triage
        status:
          const: recommended
        not_enough_evidence:
          const: false
    then:
      properties:
        hypotheses:
          minItems: 1
  - if:
      required:
        - status
      properties:
        status:
          const: failed
    then:
      required:
        - failure_reason
      properties:
        hypotheses:
          maxItems: 0
        suggested_action:
          properties:
            type:
              enum:
                - investigate
                - escalate
    else:
      not:
        required:
          - failure_reason
  - if:
      required:
        - status
      properties:
        status:
          const: no_change
    then:
      properties:
        fix:
          not:
            anyOf:
              - required:
                  - patch_sha256
              - required:
                  - pr_number
  - if:
      required:
        - status
      properties:
        status:
          const: pr_opened
    then:
      properties:
        fix:
          required:
            - pr_number
            - patch_sha256
            - to_version
        suggested_action:
          properties:
            type:
              const: review_pr
    else:
      properties:
        fix:
          not:
            required:
              - pr_number
        suggested_action:
          properties:
            type:
              not:
                const: review_pr
$defs:
  safeText:
    description: 'Texto curto, uma linha (sem \r, \n, \u000b, \u000c, \u0085, \u2028, \u2029), sem `//` (cobre esquema:// e URL relativa a protocolo), sem `www.`, `mailto:`, `tel:`, `javascript:`, `data:tipo/`, sem domínio seguido de caminho (`.tld/`), sem markdown de link ou imagem (`](`, `![`) e sem `<` ou `>` (sintaxe de link do Slack e HTML). Domínio nu sem caminho (`exemplo.com`) não é barrado: o publicador publica texto puro, sem mrkdwn e sem unfurl.'
    type: string
    minLength: 1
    maxLength: 280
    pattern: ^(?![\s\S]*(//|[Ww][Ww][Ww]\.|\.[A-Za-z]{2,}/|\]\(|!\[|[<>]|[Mm][Aa][Ii][Ll][Tt][Oo]:|[Tt][Ee][Ll]:|[Jj][Aa][Vv][Aa][Ss][Cc][Rr][Ii][Pp][Tt]:|[Dd][Aa][Tt][Aa]:[A-Za-z]+/))[^\r\n\u000b\u000c\u0085\u2028\u2029]+$(?!\n)
  identifier:
    type: string
    minLength: 1
    maxLength: 128
    pattern: ^[A-Za-z0-9][A-Za-z0-9._:=-]*$(?!\n)
  evidenceRef:
    description: 'Evidência: `collector` e `query_id` são a referência estruturada à consulta fixa; `value` é um resumo curto em texto, sujeito ao detector de D-43 antes de publicar. O workflow monta o link a partir de `collector` + `query_id`.'
    type: object
    additionalProperties: false
    required:
      - collector
      - query_id
      - value
    properties:
      collector:
        type: string
        minLength: 1
        maxLength: 63
        pattern: ^[a-z0-9][a-z0-9-]{0,62}$(?!\n)
      query_id:
        description: Id da consulta fixa; o workflow confere contra o registro de consultas antes de publicar.
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^(?!.*\.\.)[A-Za-z0-9][A-Za-z0-9._:=-]*$(?!\n)
      value:
        $ref: '#/$defs/safeText'
        maxLength: 120
  hypothesis:
    type: object
    additionalProperties: false
    required:
      - cause
      - confidence
      - evidence
    properties:
      cause:
        $ref: '#/$defs/safeText'
        maxLength: 200
      confidence:
        description: Confiança qualitativa; G-P1 mede hipótese errada com `high`.
        enum:
          - low
          - medium
          - high
      evidence:
        type: array
        minItems: 1
        maxItems: 5
        items:
          $ref: '#/$defs/evidenceRef'
  fix:
    description: Resultado do vuln fixer (P5). O conteúdo do patch fica em `/out/patch.diff`; aqui só o hash. O link do PR é montado pelo workflow a partir do repositório do evento e de `pr_number`.
    type: object
    additionalProperties: false
    required:
      - advisory_id
      - package
      - from_version
      - level
      - ci_status
      - rescan
      - evidence
    properties:
      advisory_id:
        type: string
        maxLength: 32
        pattern: ^(CVE-[0-9]{4}-[0-9]{4,7}|GHSA(-[23456789cfghjmpqrvwx]{4}){3})$(?!\n)
      package:
        type: string
        minLength: 3
        maxLength: 200
        pattern: ^[A-Za-z0-9_.-]+:[A-Za-z0-9_.-]+$(?!\n)
      from_version:
        $ref: '#/$defs/version'
      to_version:
        $ref: '#/$defs/version'
      level:
        description: 'N1: osv-scanner fix sem modelo. N2: harness devolve patch.diff. N3 está fora desta versão.'
        enum:
          - N1
          - N2
      patch_sha256:
        type: string
        maxLength: 64
        pattern: ^[0-9a-f]{64}$(?!\n)
      pr_number:
        type: integer
        minimum: 1
        maximum: 999999999
      ci_status:
        enum:
          - passed
          - failed
          - pending
          - not_run
      rescan:
        description: Resultado do re-scan OSV depois da correção.
        enum:
          - clean
          - still_vulnerable
          - not_run
      evidence:
        type: array
        minItems: 1
        maxItems: 5
        items:
          $ref: '#/$defs/evidenceRef'
  version:
    type: string
    minLength: 1
    maxLength: 64
    pattern: ^[A-Za-z0-9][A-Za-z0-9._+-]*$(?!\n)
